name: AIDE CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aide-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIDE_PYTHON: python3
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.4.0
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet debugpy
        id: install_debugpy
      - name: install locked dependencies
        id: install
        run: npm ci
      - name: frontend build
        id: frontend
        if: always() && steps.install.outcome == 'success'
        run: npm run build:frontend
      - name: backend and integration tests
        id: backend_tests
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 25
        run: node scripts/ci-run-all.mjs
      - name: type checks and lint
        id: static
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 15
        run: npx tsc -p tsconfig.node.json && npx tsc -p browser/tsconfig.browser.json && npx eslint .
      - name: architecture tests (bounded)
        id: architecture
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 20
        run: |
          set +e
          timeout -k 30 900 node scripts/run-arch.mjs > /tmp/arch-out.txt 2>&1
          status=$?
          echo "node --test exit=$status"
          echo "=== output tail ==="
          tail -60 /tmp/arch-out.txt
          echo "=== end tail ==="
          if [ $status -ne 0 ]; then
            echo "::error::ARCH_TAIL1: $(tail -c 3000 /tmp/arch-out.txt | tr '\n' ';' | head -c 2950)"
            echo "::error::ARCH_TAIL2: $(tail -c 6000 /tmp/arch-out.txt | head -c 3000 | tr '\n' ';' | head -c 2950)"
            echo "::error::ARCH_PS: $(ps -eo pid,ppid,etime,cmd | head -40 | tr '\n' ';' | head -c 2950)"
          fi
          echo "::error::ARCH_FILES: $(grep -o 'tests/arch/[a-z0-9.-]*\.test\.ts' /tmp/arch-out.txt | sort | uniq -c | sort -rn | tr '\n' ';' | head -c 2950)"
          echo "::error::ARCH_TIMEOUTS: $(grep -i -A2 'timed out' /tmp/arch-out.txt | tr '\n' ';' | head -c 2950)"
          echo "::error::ARCH_LASTLINES: $(grep '^✖\|^✔' /tmp/arch-out.txt | tail -30 | tr '\n' ';' | head -c 2950)"
          if [ $status -ne 0 ]; then
            exit 1
          fi
          exit 0
      - name: upload arch test log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: arch-test-log
          path: /tmp/arch-out.txt
          if-no-files-found: ignore
      - name: veritas gates
        id: veritas
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 25
        run: |
          set +e
          npm run veritas -- --json > /tmp/veritas.json 2>/tmp/veritas.err
          status=$?
          echo "::error::VERITAS_STATUS: exit=$status json_bytes=$(wc -c < /tmp/veritas.json)"
          head -c 1200 /tmp/veritas.err | tr '\n' ' ' | sed 's/%/%25/g' | xargs -I{} echo "::error::VERITAS_STDERR: {}"
          node scripts/veritas-summary.mjs /tmp/veritas.json || true
          printf '%s\n' "::error::VERITAS_JSONHEAD: $(head -c 400 /tmp/veritas.json | tr -d '\n\r')"
          exit $status
      - name: veritas report from captured gates
        if: always() && steps.install.outcome == 'success'
        run: node scripts/veritas-report-from-json.mjs /tmp/veritas.json artifacts/veritas.md
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: veritas-report
          path: artifacts/veritas.md
          if-no-files-found: ignore
      - name: generated-file and worktree check
        id: worktree
        if: always() && steps.install.outcome == 'success'
        env:
          AIDE_CI_WORKTREE_REPORT: /tmp/ci-worktree-status.txt
        run: node scripts/ci-worktree-check.mjs
      - name: fixture cleanup
        id: cleanup
        if: always()
        env:
          AIDE_CI_CLEANUP_REPORT: /tmp/ci-cleanup-status.txt
        run: node scripts/ci-cleanup.mjs
      - name: upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-diagnostics
          path: |
            /tmp/arch-out.txt
            /tmp/veritas.json
            /tmp/veritas.err
            /tmp/ci-worktree-status.txt
            /tmp/ci-cleanup-status.txt
          if-no-files-found: ignore
      - name: required gate summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          STATIC: ${{ steps.static.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          VERITAS: ${{ steps.veritas.outcome }}
          WORKTREE: ${{ steps.worktree.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          printf 'AIDE CI gates: install=%s frontend=%s backend_tests=%s static=%s architecture=%s veritas=%s worktree=%s cleanup=%s\n' \
            "$INSTALL" "$FRONTEND" "$BACKEND_TESTS" "$STATIC" "$ARCHITECTURE" "$VERITAS" "$WORKTREE" "$CLEANUP"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo '## AIDE CI required gates'
              echo
              echo '| Gate | Outcome |'
              echo '| --- | --- |'
              printf '| install | %s |\n| frontend | %s |\n| backend tests | %s |\n| TypeScript + ESLint | %s |\n| architecture | %s |\n| Veritas | %s |\n| worktree | %s |\n| cleanup | %s |\n' \
                "$INSTALL" "$FRONTEND" "$BACKEND_TESTS" "$STATIC" "$ARCHITECTURE" "$VERITAS" "$WORKTREE" "$CLEANUP"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$INSTALL" != 'success' ] || [ "$FRONTEND" != 'success' ] || [ "$BACKEND_TESTS" != 'success' ] || [ "$STATIC" != 'success' ] || [ "$ARCHITECTURE" != 'success' ] || [ "$VERITAS" != 'success' ] || [ "$WORKTREE" != 'success' ] || [ "$CLEANUP" != 'success' ]; then
            echo "::error::CI_GATE_FAILURE: one or more required gates failed; see the gate summary and ci-diagnostics artifact."
            exit 1
          fi
